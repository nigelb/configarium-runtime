[project]
name = "configarium-runtime"
authors = [{ name = "NigelB", email = "nigel.blair@gmail.com" }]
description = "A Python library providing runtime utilities for configarium-models."
requires-python = ">=3.10"
version = "0.0.1"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
]

dependencies = [
    "pydantic>=2.13.5",
    "configarium-models @ git+https://github.com/nigelb/configarium-models.git",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pytest",
]
mqtt = [
    "paho-mqtt>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D212", # Multi-line docstring summary should start at the first line.
    "D203" # 1 blank line required before class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Use of assert detected (assert is fine in tests)
    "S105",     # Hardcoded password (test fixtures use mock credentials)
    "SLF001",   # Private member access (tests need to access private state for setup/teardown)
    "ARG002",   # Unused method argument (pytest fixtures used for side effects)
    "PLR2004",  # Magic value comparison (test assertions should be explicit)
]
"examples/**/*.py" = [
    "T201",     # print statements are fine in examples
    "S105",     # Hardcoded passwords are fine in examples
    "INP001",   # Examples don't need __init__.py
    "D401",     # Docstring style can be relaxed in examples
    "ERA001",   # Commented code is fine for demonstration
    "PLC0415",  # Import location flexibility for examples
    "CPY001",   # Copyright not required in examples
]
